<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
  <title id="title">BLEVE Pressure Intelligence modelling workflow</title>
  <desc id="desc">A six-stage pipeline from simulation records through quality controls, physics-guided features, model comparison, calibration, and validated pressure export.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a17"/>
      <stop offset="1" stop-color="#0a1730"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#56d8ff"/>
      <stop offset="1" stop-color="#6578ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5 0 10Z" fill="#66cfff"/>
    </marker>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#84a8d5" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1600" height="650" rx="28" fill="url(#background)"/>
  <rect width="1600" height="650" rx="28" fill="url(#grid)"/>
  <text x="64" y="77" fill="#f0f6ff" font-family="Inter,Arial,sans-serif" font-size="35" font-weight="760" letter-spacing="-1">Evidence-led modelling, end to end</text>
  <text x="64" y="108" fill="#8fa3bd" font-family="Inter,Arial,sans-serif" font-size="15">Every stage leaves an inspectable artifact; no automated score is presented as operational safety advice.</text>

  <path d="M187 290H1417" stroke="url(#line)" stroke-width="2" stroke-opacity="0.55" marker-end="url(#arrow)"/>

  <g font-family="Inter,Arial,sans-serif">
    <g transform="translate(58 176)">
      <rect width="218" height="228" rx="20" fill="#0b1730" stroke="#62d9ff" stroke-opacity="0.3"/>
      <text x="20" y="35" fill="#67dfff" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">01 / INGEST</text>
      <circle cx="109" cy="102" r="34" fill="#112b4d" stroke="#73dfff" stroke-opacity="0.6"/>
      <path d="M89 91h40M89 102h40M89 113h28" stroke="#8be7ff" stroke-width="3" stroke-linecap="round"/>
      <text x="20" y="164" fill="#e7f1ff" font-size="19" font-weight="700">Scenario data</text>
      <text x="20" y="191" fill="#8da0ba" font-size="13">Tank · obstacle</text>
      <text x="20" y="211" fill="#8da0ba" font-size="13">thermodynamic · sensor</text>
    </g>

    <g transform="translate(310 176)">
      <rect width="218" height="228" rx="20" fill="#0b1730" stroke="#62d9ff" stroke-opacity="0.3"/>
      <text x="20" y="35" fill="#67dfff" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">02 / GOVERN</text>
      <circle cx="109" cy="102" r="34" fill="#112b4d" stroke="#73dfff" stroke-opacity="0.6"/>
      <path d="M92 103l11 11 25-28" fill="none" stroke="#8be7ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="20" y="164" fill="#e7f1ff" font-size="19" font-weight="700">Quality gate</text>
      <text x="20" y="191" fill="#8da0ba" font-size="13">Invalid targets · duplicates</text>
      <text x="20" y="211" fill="#8da0ba" font-size="13">categories · missing values</text>
    </g>

    <g transform="translate(562 176)">
      <rect width="218" height="228" rx="20" fill="#0b1730" stroke="#62d9ff" stroke-opacity="0.3"/>
      <text x="20" y="35" fill="#67dfff" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">03 / ENRICH</text>
      <circle cx="109" cy="102" r="34" fill="#112b4d" stroke="#73dfff" stroke-opacity="0.6"/>
      <path d="M86 109c15-5 22-23 35-23 8 0 13 7 17 15" fill="none" stroke="#8be7ff" stroke-width="3" stroke-linecap="round"/>
      <circle cx="87" cy="109" r="4" fill="#8be7ff"/><circle cx="121" cy="86" r="4" fill="#8be7ff"/><circle cx="138" cy="101" r="4" fill="#8be7ff"/>
      <text x="20" y="164" fill="#e7f1ff" font-size="19" font-weight="700">Physics features</text>
      <text x="20" y="191" fill="#8da0ba" font-size="13">Geometry · ratios</text>
      <text x="20" y="211" fill="#8da0ba" font-size="13">distance decay · shielding</text>
    </g>

    <g transform="translate(814 176)">
      <rect width="218" height="228" rx="20" fill="#0b1730" stroke="#62d9ff" stroke-opacity="0.3"/>
      <text x="20" y="35" fill="#67dfff" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">04 / COMPARE</text>
      <circle cx="109" cy="102" r="34" fill="#112b4d" stroke="#73dfff" stroke-opacity="0.6"/>
      <rect x="89" y="101" width="7" height="18" rx="2" fill="#8be7ff"/><rect x="102" y="91" width="7" height="28" rx="2" fill="#8be7ff"/><rect x="115" y="80" width="7" height="39" rx="2" fill="#8be7ff"/><rect x="128" y="95" width="7" height="24" rx="2" fill="#8be7ff"/>
      <text x="20" y="164" fill="#e7f1ff" font-size="19" font-weight="700">Model arena</text>
      <text x="20" y="191" fill="#8da0ba" font-size="13">Linear · SVR · MLP</text>
      <text x="20" y="211" fill="#8da0ba" font-size="13">gradient boosting</text>
    </g>

    <g transform="translate(1066 176)">
      <rect width="218" height="228" rx="20" fill="#0b1730" stroke="#62d9ff" stroke-opacity="0.3"/>
      <text x="20" y="35" fill="#67dfff" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">05 / CALIBRATE</text>
      <circle cx="109" cy="102" r="34" fill="#112b4d" stroke="#73dfff" stroke-opacity="0.6"/>
      <path d="M84 108h12l8-19 11 28 9-17h10" fill="none" stroke="#8be7ff" stroke-width="3" stroke-linejoin="round"/>
      <text x="20" y="164" fill="#e7f1ff" font-size="19" font-weight="700">Bounded ensemble</text>
      <text x="20" y="191" fill="#8da0ba" font-size="13">HGB + MLP blend</text>
      <text x="20" y="211" fill="#8da0ba" font-size="13">Huber residual correction</text>
    </g>

    <g transform="translate(1318 176)">
      <rect width="218" height="228" rx="20" fill="#10203c" stroke="#6fe0ff" stroke-opacity="0.62"/>
      <text x="20" y="35" fill="#7ae8ff" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">06 / VERIFY</text>
      <circle cx="109" cy="102" r="34" fill="#16345b" stroke="#73dfff" stroke-opacity="0.75"/>
      <path d="M88 101l14 14 29-33" fill="none" stroke="#9aeeff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="20" y="164" fill="#f2f8ff" font-size="19" font-weight="700">Pressure export</text>
      <text x="20" y="191" fill="#9db0c8" font-size="13">Rows · schema · finite</text>
      <text x="20" y="211" fill="#9db0c8" font-size="13">positive predictions</text>
    </g>
  </g>

  <g transform="translate(58 458)" font-family="Inter,Arial,sans-serif">
    <rect width="1478" height="126" rx="18" fill="#081225" stroke="#739edd" stroke-opacity="0.16"/>
    <text x="24" y="31" fill="#6f83a0" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="700" letter-spacing="1.2">VALIDATION BOUNDARY</text>
    <text x="24" y="66" fill="#dfe9f7" font-size="17" font-weight="650">Cross-fitted model evidence</text>
    <text x="24" y="94" fill="#879ab4" font-size="13">OOF metrics guide selection; an external public split exposes the remaining generalisation gap.</text>
    <path d="M768 25V101" stroke="#7896c4" stroke-opacity="0.18"/>
    <text x="800" y="66" fill="#dfe9f7" font-size="17" font-weight="650">Responsible interpretation</text>
    <text x="800" y="94" fill="#879ab4" font-size="13">Simulation output supports research—not live hazard monitoring or certified safety decisions.</text>
  </g>
</svg>
