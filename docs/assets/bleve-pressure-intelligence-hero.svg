<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">BLEVE Pressure Intelligence</title>
  <desc id="desc">A dark technical overview showing the physics-guided machine-learning pipeline and recorded validation evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.62" stop-color="#071229"/>
      <stop offset="1" stop-color="#0a1a32"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.34" r="0.6">
      <stop offset="0" stop-color="#2f8fff" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#184d9b" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#050816" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58d6ff"/>
      <stop offset="1" stop-color="#6078ff"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#79a9de" stroke-opacity="0.065"/>
    </pattern>
  </defs>

  <rect width="1600" height="720" rx="30" fill="url(#bg)"/>
  <rect width="1600" height="720" rx="30" fill="url(#grid)"/>
  <rect width="1600" height="720" rx="30" fill="url(#glow)"/>
  <path d="M48 48H1552" stroke="#6edcff" stroke-opacity="0.24"/>
  <path d="M48 672H1552" stroke="#6edcff" stroke-opacity="0.12"/>

  <g transform="translate(70 74)">
