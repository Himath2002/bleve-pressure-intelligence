        <path d="M359 59H407"/>
        <path d="M407 59l-8-6m8 6l-8 6"/>
        <path d="M517 59H579"/>
        <path d="M579 59l-8-6m8 6l-8 6"/>
      </g>
    </g>

    <g transform="translate(0 438)">
      <text y="20" fill="#71839d" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700" letter-spacing="1.4">ENGINEERING FOCUS</text>
      <g transform="translate(0 42)" fill="#aebbd0" font-family="Inter,Arial,sans-serif" font-size="14">
        <rect width="180" height="38" rx="19" fill="#0c1b34" stroke="#76bfff" stroke-opacity="0.22"/>
        <text x="18" y="24">Sensor geometry</text>
        <rect x="194" width="194" height="38" rx="19" fill="#0c1b34" stroke="#76bfff" stroke-opacity="0.22"/>
        <text x="212" y="24">Thermodynamics</text>
        <rect x="402" width="188" height="38" rx="19" fill="#0c1b34" stroke="#76bfff" stroke-opacity="0.22"/>
        <text x="420" y="24">Obstacle effects</text>
        <rect x="604" width="186" height="38" rx="19" fill="#0c1b34" stroke="#76bfff" stroke-opacity="0.22"/>
        <text x="622" y="24">Export integrity</text>
      </g>
