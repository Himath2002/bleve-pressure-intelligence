  <g transform="translate(1010 92)">
    <circle cx="232" cy="218" r="194" fill="#07152c" stroke="#6edcff" stroke-opacity="0.18"/>
    <circle cx="232" cy="218" r="147" fill="none" stroke="#58d6ff" stroke-opacity="0.16" stroke-width="22"/>
    <circle cx="232" cy="218" r="106" fill="none" stroke="#6d7fff" stroke-opacity="0.22" stroke-width="2"/>
    <circle cx="232" cy="218" r="58" fill="#102b50" stroke="#68ddff" stroke-opacity="0.7"/>
    <path d="M232 160v116M174 218h116" stroke="#72ddff" stroke-opacity="0.38"/>
    <path d="M68 218c48-72 102-109 164-109s116 37 164 109c-48 72-102 109-164 109S116 290 68 218Z" fill="none" stroke="#6edcff" stroke-opacity="0.2"/>
    <path d="M3 218c65-116 141-174 229-174s164 58 229 174c-65 116-141 174-229 174S68 334 3 218Z" fill="none" stroke="#718dff" stroke-opacity="0.16"/>
    <circle cx="232" cy="218" r="6" fill="#75e5ff" filter="url(#softGlow)"/>

    <g transform="translate(-18 438)">
      <rect width="500" height="116" rx="20" fill="#081327" stroke="#74caff" stroke-opacity="0.24"/>
      <g font-family="Inter,Arial,sans-serif">
        <text x="24" y="29" fill="#6f82a0" font-size="11" font-weight="700" letter-spacing="1.2">RECORDED VALIDATION</text>
        <text x="24" y="72" fill="#f1f7ff" font-size="31" font-weight="780">8.92%</text>
        <text x="24" y="94" fill="#8fa2bd" font-size="12">out-of-fold MAPE</text>
        <text x="191" y="72" fill="#f1f7ff" font-size="31" font-weight="780">0.975</text>
        <text x="191" y="94" fill="#8fa2bd" font-size="12">out-of-fold R²</text>
        <text x="352" y="72" fill="#f1f7ff" font-size="31" font-weight="780">16.23%</text>
        <text x="352" y="94" fill="#8fa2bd" font-size="12">public holdout MAPE</text>
      </g>
    </g>
