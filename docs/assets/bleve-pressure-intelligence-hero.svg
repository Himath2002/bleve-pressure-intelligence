  <text x="70" y="694" fill="#526783" font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="1.2">RESEARCH / SIMULATION / DECISION-SUPPORT - NOT A CERTIFIED SAFETY SYSTEM</text>
