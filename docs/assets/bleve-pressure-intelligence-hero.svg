    <circle cx="18" cy="17" r="5" fill="#63e1ff" filter="url(#softGlow)"/>
    <text x="34" y="22" fill="#bceeff" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.6">PHYSICS-GUIDED ML</text>

    <text x="0" y="126" fill="#f4f8ff" font-family="Inter,Arial,sans-serif" font-size="76" font-weight="780" letter-spacing="-3">BLEVE PRESSURE</text>
    <text x="0" y="205" fill="none" stroke="#79bfff" stroke-opacity="0.92" stroke-width="1.5" font-family="Inter,Arial,sans-serif" font-size="76" font-weight="780" letter-spacing="-3">INTELLIGENCE</text>
    <text x="2" y="255" fill="#9eb0c9" font-family="Inter,Arial,sans-serif" font-size="21">Peak blast-pressure estimation across simulated industrial scenarios</text>

    <g transform="translate(0 312)">
      <rect width="790" height="94" rx="18" fill="#081226" stroke="#7bb8ff" stroke-opacity="0.18"/>
      <text x="24" y="30" fill="#61d9ff" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700" letter-spacing="1.4">SIGNAL PATH</text>
      <g fill="#dfe9f8" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="650">
        <text x="24" y="65">Scenario data</text>
        <text x="217" y="65">Physics features</text>
        <text x="432" y="65">Ensemble</text>
        <text x="604" y="65">Validated output</text>
